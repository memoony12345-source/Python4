name: Build NassakOCR APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download Arabic and English OCR language data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata \
            -o app/src/main/assets/tessdata/ara.traineddata
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata \
            -o app/src/main/assets/tessdata/eng.traineddata
          test -s app/src/main/assets/tessdata/ara.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NassakOCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
